<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>

</head>
<body class="h-[100dvh] bg-[#f5f5f5] py-20">
    <main class="max-w-lg mx-auto">
        <div class="border border-[#e5e5e5] rounded-lg w-full bg-white p-5 mb-3">
            
            <div class="flex items-center gap-2">
                <i class="ph ph-upload-simple"></i>

                <p class="text-sm font-semibold">Загрузка файла</p>
            </div>
            <div>
                <button id="upload" class="text-xs border border-[#a3a3a3] bg-[#fafafa] px-3 py-2 rounded-lg mt-2">Выбрать файл</button>

                
            </div>
            <audio id="recAudio" hidden controls class="flex items "></audio>

            <div id="uploadMusic" hidden class="mt-4 py-2.3 px-3 bg-[#fafafa] border border-[#e5e5e5] rounded-lg flex items-center gap-2.5">
                <div class="size-8 flex items-center justify-center rounded-sm bg-white border border-[#e5e5e5]">
                    <i class="ph ph-music-notes-simple text-[#e5e5e5]"></i>
                </div>

                <div>
                    <div id="fileName" class="text-xs font-medium"></div>

                    <div id="fileSize" class="text-xs text-[#737373]"></div>
                </div>
            </div>

            <div id=upAction hidden class="flex items-center gap-2.5 mt-4">
                <button id="upSend" class="text-xs border border-transparent text-white bg-black bg-[#fafafa] px-3 py-2 rounded-lg">Распознать</button>

                <button id="upDelete" class="text-xs border border-[#a3a3a3] bg-[#fafafa] px-3 py-2 rounded-lg">Удалить</button>
            </div>

            <input type="file" id="fileInput" style="display:nano;"/>
        </div>

        <div class="border border-[#e5e5e5] bg-white shadow-sm rounded-lg p-5">
            <div class="flex items-center gap-2 mt-2">

                <i class="ph ph-list"></i>

                <p class="text-sm font-semibold ">Расшифровка</p>
            </div>

            <div id="transcriptionBody" class="border border=[#e5e5e5] bg-[#fafafa] min-h-[88px] rounded-lg p-4 text-left">
                Текст появится здесь после распознавания аудио
            </div>
        </div>


    </main>

    <script type="text/javascript" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
